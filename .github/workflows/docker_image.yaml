# Build Docker images for copyusagereport and xtenancycheck (x86).
#
# Required secrets for Docker Hub login (Settings → Secrets and variables → Actions):
#   DOCKERHUB_USERNAME - Docker Hub username (e.g. mikarinneoracle)
#   DOCKERHUB_PASSWORD - Docker Hub password
#
# Optional: push only on push to main; on pull_request we only build.

name: Docker Image CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build copyusagereport image
        uses: docker/build-push-action@v6
        with:
          context: ./copyusagereport
          file: ./copyusagereport/Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            mikarinneoracle/oci-copy-usage-report:x86
            mikarinneoracle/oci-copy-usage-report:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build xtenancycheck image
        uses: docker/build-push-action@v6
        with:
          context: ./xtenancycheck
          file: ./xtenancycheck/Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            mikarinneoracle/oci-xtenancy-check:x86
            mikarinneoracle/oci-xtenancy-check:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
